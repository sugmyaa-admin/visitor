server {
    listen 443 ssl;
    server_name sugmyatech.com www.sugmyatech.com;

    ssl_certificate /etc/letsencrypt/live/sugmyatech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sugmyatech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ---------- API FIRST ----------
    location /visitor-api/ {
        proxy_pass http://backend:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection keep-alive;
    }

    # ---------- Frontend ----------
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Important for Angular SPA
        try_files $uri $uri/ /index.html;
    }
}

