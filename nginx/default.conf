server {
    listen 443 ssl;
    server_name sugmyatech.com www.sugmyatech.com;

    ssl_certificate /etc/letsencrypt/live/sugmyatech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sugmyatech.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;


    location ^~ /visitor-api/ {
        proxy_pass http://backend:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Swagger explicitly block from frontend
    location ^~ /swagger/ {
        proxy_pass http://backend:80/swagger/;
    }

    #  Everything else → Frontend
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        try_files $uri $uri/ /index.html;
    }
}
