[ec2-user@ip-10-0-1-158 nginx]$ cat default.conf
server {
    listen 443 ssl;
    server_name sugmyatech.com www.sugmyatech.com;

    ssl_certificate /etc/letsencrypt/live/sugmyatech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sugmyatech.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    location /visitor-api/ {
        proxy_pass http://visitor-backend:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /swagger/ {
        proxy_pass http://visitor-backend:80/swagger/;
    }

    location / {
        proxy_pass http://visitor-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
